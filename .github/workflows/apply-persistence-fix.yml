name: Apply persistence fixes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply persistence fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/App.tsx')
          text = path.read_text(encoding='utf-8')

          old = "const [isLoggedIn, setIsLoggedIn] = useState(false);"
          new = "const [isLoggedIn, setIsLoggedIn] = useState(() => localStorage.getItem('mataram76_admin_session') === 'true');"
          if old in text and new not in text:
              text = text.replace(old, new, 1)

          old = """const [adminCredentials, setAdminCredentials] = useState({
    username: 'admin',
    password: 'mataram76'
  });"""
          new = """const [adminCredentials, setAdminCredentials] = useState(() => {
    try {
      const saved = localStorage.getItem('mataram76_admin_credentials');
      if (saved) {
        const parsed = JSON.parse(saved);
        return {
          username: parsed.username || 'admin',
          password: parsed.password || 'mataram76'
        };
      }
    } catch (error) {
      console.warn('Gagal membaca kredensial admin tersimpan:', error);
    }
    return { username: 'admin', password: 'mataram76' };
  });"""
          if old in text and "mataram76_admin_credentials" not in text:
              text = text.replace(old, new, 1)

          old = """const [settings, setSettings] = useState({
    autoCalculate: true,
    zones: [
      { city: 'Yogyakarta', price: 30000 },
      { city: 'Semarang', price: 25000 },
      { city: 'Solo', price: 30000 },
      { city: 'Purwokerto', price: 40000 },
      { city: 'Magelang', price: 35000 }
    ],
    pricePerKg: 5000,
    standardWeight: 3,
    dimensionThreshold: 5000,
    dimensionSurcharge: 15000
  });"""
          new = """const [settings, setSettings] = useState(() => {
    const defaults = {
      autoCalculate: true,
      zones: [
        { city: 'Yogyakarta', price: 30000 },
        { city: 'Semarang', price: 25000 },
        { city: 'Solo', price: 30000 },
        { city: 'Purwokerto', price: 40000 },
        { city: 'Magelang', price: 35000 }
      ],
      pricePerKg: 5000,
      standardWeight: 3,
      dimensionThreshold: 5000,
      dimensionSurcharge: 15000
    };
    try {
      const saved = localStorage.getItem('mataram76_shipping_settings');
      if (saved) {
        const parsed = JSON.parse(saved);
        if (parsed && Array.isArray(parsed.zones)) {
          return { ...defaults, ...parsed, zones: parsed.zones };
        }
      }
    } catch (error) {
      console.warn('Gagal membaca pengaturan ongkir tersimpan:', error);
    }
    return defaults;
  });"""
          if old in text and "mataram76_shipping_settings" not in text:
              text = text.replace(old, new, 1)

          marker = "  const [selectedReceipt, setSelectedReceipt] = useState(null);\n"
          insertion = """  const [selectedReceipt, setSelectedReceipt] = useState(null);

  // Persistensi lokal hanya untuk konfigurasi aplikasi dan sesi admin.
  // Tidak menyentuh data transaksi/Firebase shipments/customers.
  useEffect(() => {
    try {
      localStorage.setItem('mataram76_shipping_settings', JSON.stringify(settings));
    } catch (error) {
      console.warn('Gagal menyimpan pengaturan ongkir:', error);
    }
  }, [settings]);

  useEffect(() => {
    try {
      localStorage.setItem('mataram76_admin_credentials', JSON.stringify(adminCredentials));
    } catch (error) {
      console.warn('Gagal menyimpan kredensial admin:', error);
    }
  }, [adminCredentials]);
"""
          if marker in text and "Persistensi lokal hanya untuk konfigurasi" not in text:
              text = text.replace(marker, insertion, 1)

          old = """      setIsLoggedIn(true);
      setLoginError('');"""
          new = """      setIsLoggedIn(true);
      localStorage.setItem('mataram76_admin_session', 'true');
      setLoginError('');"""
          if old in text and "mataram76_admin_session', 'true'" not in text:
              text = text.replace(old, new, 1)

          old = """  const handleLogout = () => {
    setIsLoggedIn(false);
    setUsernameInput('');"""
          new = """  const handleLogout = () => {
    setIsLoggedIn(false);
    localStorage.removeItem('mataram76_admin_session');
    setUsernameInput('');"""
          if old in text and "removeItem('mataram76_admin_session')" not in text:
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

          if "mataram76_admin_session" not in text or "mataram76_shipping_settings" not in text:
              raise SystemExit('Persistence patch did not apply completely')

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: persist settings and admin session across reloads"
          git push origin main

      - name: Remove temporary workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/apply-persistence-fix.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove temporary persistence workflow"
            git push origin main
          fi
